apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: Never
          # Dikkat: main.py'de uvicorn'u --port 8001 ile başlatmıştık,
          # ama Dockerfile'da CMD içinde port'u nasıl tanımladıysak
          # container içindeki gerçek port o. Kontrol edip 8001 yazıyoruz.
          ports:
            - containerPort: 8001
