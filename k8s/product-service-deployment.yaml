apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          # env - container'a "DATABASE_URL" ortam değişkenini veriyoruz
          # database.py artık bunu okuyup Kubernetes içindeki
          # gerçek PostgreSQL adresine bağlanacak
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://berk:berk123@product-postgres:5432/productdb"
